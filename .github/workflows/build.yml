name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    name: Bangun APK
    runs-on: ubuntu-latest

    steps:
      - name: Ambil Kode
        uses: actions/checkout@v4

      - name: Siapkan Java
        uses: actions/setup-java@v4
        with:
          java-version: 17
          distribution: temurin

      - name: Beri Izin Gradle
        run: chmod +x gradlew

      - name: Bangun APK
        run: ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Pantau-Baterai-APK
          path: app/build/outputs/apk/debug/app-debug.apk
